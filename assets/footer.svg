<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" role="img" aria-label="Thanks for stopping by">
  <defs>
    <clipPath id="win"><rect x="8" y="8" width="1184" height="80" rx="12"/></clipPath>
  </defs>
  <style>
    .mono { font-family: "JetBrains Mono", "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <g clip-path="url(#win)">
    <rect x="8" y="8" width="1184" height="80" fill="#0d1117"/>
  </g>
  <rect x="8.5" y="8.5" width="1183" height="79" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>
  <g class="mono" font-size="16">
    <text x="40" y="54" fill="#6b7685"><tspan fill="#28c840">➜</tspan>  <tspan fill="#7fe3ff">~</tspan>  echo "thanks for stopping by"  <tspan fill="#3d4654">&amp;&amp;</tspan>  exit <tspan fill="#28c840">0</tspan> <tspan class="cursor" fill="#7fe3ff">█</tspan></text>
    <text x="1160" y="54" text-anchor="end" fill="#3d4654">made with <tspan fill="#00add8">Go</tspan> &amp; bugs</text>
  </g>
</svg>
