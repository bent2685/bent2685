<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="bent — Full-stack developer, Go maximalist, building Vetta">
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#7fe3ff"/>
      <stop offset="1" stop-color="#00add8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#00add8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#00add8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="1" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.15"/>
    </linearGradient>
    <mask id="dotmask"><rect width="1200" height="340" fill="url(#fade)"/></mask>
    <clipPath id="win"><rect x="8" y="8" width="1184" height="324" rx="18"/></clipPath>
  </defs>
  <style>
    .mono { font-family: "JetBrains Mono", "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .l { }
    .l1 { animation-delay: .2s; } .l2 { animation-delay: .7s; } .l3 { animation-delay: 1.1s; } .l4 { animation-delay: 1.5s; } .l5 { animation-delay: 1.9s; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .orbit { transform-origin: 980px 175px; animation: spin 40s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <g clip-path="url(#win)">
    <rect x="8" y="8" width="1184" height="324" fill="#0a0d12"/>
    <rect x="8" y="8" width="1184" height="324" fill="url(#dots)" mask="url(#dotmask)"/>
    <rect x="8" y="8" width="1184" height="324" fill="url(#glow)"/>
    <rect x="8" y="8" width="1184" height="324" fill="url(#glow2)"/>

    <!-- title bar -->
    <rect x="8" y="8" width="1184" height="42" fill="#ffffff" fill-opacity="0.03"/>
    <circle cx="36" cy="29" r="6.5" fill="#ff5f57"/>
    <circle cx="58" cy="29" r="6.5" fill="#febc2e"/>
    <circle cx="80" cy="29" r="6.5" fill="#28c840"/>
    <text x="600" y="34" text-anchor="middle" class="mono" font-size="13" fill="#6b7685">bent@github: ~/profile — zsh</text>

    <!-- decorative orbit -->
    <g class="orbit" opacity="0.9">
      <circle cx="980" cy="175" r="92" fill="none" stroke="#00add8" stroke-opacity="0.22" stroke-dasharray="2 7"/>
      <circle cx="980" cy="175" r="132" fill="none" stroke="#ffffff" stroke-opacity="0.07"/>
      <circle cx="1072" cy="175" r="4" fill="#00add8"/>
      <circle cx="848" cy="175" r="3" fill="#a78bfa"/>
    </g>
    <text x="980" y="196" text-anchor="middle" class="mono" font-size="58" font-weight="700" fill="#00add8" fill-opacity="0.9">Go</text>
    <text x="980" y="226" text-anchor="middle" class="mono" font-size="12" fill="#6b7685" letter-spacing="3">MAXIMALIST</text>
  </g>
  <rect x="8.5" y="8.5" width="1183" height="323" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.1"/>

  <!-- terminal content -->
  <g class="mono">
    <text class="l l1" x="56" y="104" font-size="17" fill="#6b7685"><tspan fill="#28c840">➜</tspan>  <tspan fill="#7fe3ff">~</tspan>  whoami</text>
    <text class="l l2" x="52" y="186" font-size="78" font-weight="800" fill="url(#name)" letter-spacing="-2">bent</text>
    <text class="l l3" x="56" y="226" font-size="19" fill="#c9d1d9">Full-stack developer <tspan fill="#3d4654">/</tspan> building <tspan fill="#ffffff" font-weight="700">Vetta</tspan></text>
    <text class="l l4" x="56" y="262" font-size="15" fill="#8b949e"><tspan fill="#00add8">#</tspan> Go maximalist  <tspan fill="#3d4654">·</tspan>  <tspan fill="#f78166">#</tspan> bug manufacturer  <tspan fill="#3d4654">·</tspan>  <tspan fill="#a78bfa">#</tspan> local-first AI</text>
    <g class="l l5">
      <text x="56" y="302" font-size="17" fill="#6b7685"><tspan fill="#28c840">➜</tspan>  <tspan fill="#7fe3ff">~</tspan>  go run . <tspan class="cursor" fill="#7fe3ff">█</tspan></text>
    </g>
  </g>
</svg>
